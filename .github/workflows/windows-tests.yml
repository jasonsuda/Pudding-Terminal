name: Windows tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connections:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Install locked Windows dependencies
        run: python -m pip --isolated --disable-pip-version-check --no-cache-dir install --only-binary ":all:" --require-hashes -r requirements-win-x64.lock
      - name: Check dependencies
        run: python -m pip --isolated --disable-pip-version-check check
      - name: Test Serial, SSH and Telnet
        run: python -X utf8 -B -m unittest discover -s tests -v
